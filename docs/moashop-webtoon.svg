<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1780" viewBox="0 0 1440 1780" role="img" aria-labelledby="title desc">
  <title id="title">모아샵 상품 구매 과정 7컷 웹툰</title>
  <desc id="desc">방문자가 상품 P1을 조회하고 로그인해 장바구니, 주문, 모의 결제, 구매내역까지 진행하는 벡터 웹툰.</desc>
  <defs>
    <style>
      text { font-family: "Malgun Gothic", "Noto Sans KR", sans-serif; fill: #20312a; }
      .headline { font-size: 42px; font-weight: 800; letter-spacing: -1.5px; }
      .subhead { font-size: 18px; fill: #61716a; }
      .cut { fill: #fff; stroke: #dfe7e1; stroke-width: 2; }
      .cut-title { font-size: 22px; font-weight: 800; }
      .caption { font-size: 15px; fill: #315e4b; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 13px; fill: #687771; }
      .bubble { fill: #fff; stroke: #47755e; stroke-width: 2; }
      .bubble-text { font-size: 17px; font-weight: 700; }
      .table-head { fill: #eef4ec; }
      .table-line { stroke: #dce5de; stroke-width: 1.5; }
      .green { fill: #215c49; }
      .lime { fill: #d7ed8d; }
      .coral { fill: #c75845; }
      .soft { fill: #f2f6ef; }
      .code { font-family: Consolas, monospace; font-size: 13px; fill: #315e4b; }
    </style>
    <g id="buyer">
      <circle cx="0" cy="0" r="27" fill="#f1c8a8" stroke="#273b31" stroke-width="3"/>
      <path d="M-27,-4 Q-25,-34 1,-30 Q27,-28 27,-4 L19,-12 L11,-20 L-8,-16 L-20,-6Z" fill="#293b34"/>
      <circle cx="-9" cy="2" r="2.2" fill="#273b31"/><circle cx="9" cy="2" r="2.2" fill="#273b31"/>
      <path d="M-6,12 Q0,17 7,11" fill="none" stroke="#b96859" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-37,79 Q-35,34 0,34 Q36,34 38,79Z" fill="#8eb8a0" stroke="#273b31" stroke-width="3"/>
      <path d="M-34,52 L-54,78 M34,52 L53,73" fill="none" stroke="#273b31" stroke-width="9" stroke-linecap="round"/>
    </g>
    <g id="shopbag">
      <path d="M-31,-3 L31,-3 L25,43 L-25,43Z" fill="#d7ed8d" stroke="#315e4b" stroke-width="3"/>
      <path d="M-15,-3 Q-14,-25 0,-25 Q15,-25 16,-3" fill="none" stroke="#315e4b" stroke-width="4"/>
      <text x="0" y="26" text-anchor="middle" font-size="17" font-weight="800">P1</text>
    </g>
  </defs>

  <rect width="1440" height="1780" fill="#f6f8f5"/>
  <text x="48" y="70" class="headline">모아샵 구매 여정</text>
  <text x="50" y="105" class="subhead">P1 티셔츠 3개를 담고 결제한 뒤, 내 구매내역에서 확인하기</text>
  <rect x="1190" y="38" width="202" height="42" rx="21" fill="#215c49"/>
  <text x="1291" y="65" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">7컷 · 실제 SVG 일러스트</text>

  <!-- CUT 1 -->
  <g transform="translate(40 145)">
    <rect class="cut" width="660" height="350" rx="24"/>
    <text x="26" y="42" class="cut-title">1컷 · P1을 발견!</text>
    <rect x="28" y="70" width="360" height="222" rx="17" class="soft"/>
    <rect x="52" y="94" width="140" height="170" rx="13" fill="#fff" stroke="#dfe7e1" stroke-width="2"/>
    <circle cx="122" cy="157" r="42" fill="#f0e4d6"/>
    <text x="122" y="173" text-anchor="middle" font-size="46">👕</text>
    <text x="70" y="222" class="body" font-weight="700">베이직 티셔츠</text>
    <text x="70" y="247" class="small">19,000원 · 재고 확인</text>
    <g transform="translate(272 202) scale(.72)"><use href="#buyer"/></g>
    <path class="bubble" d="M402 86 Q402 72 420 72 H616 Q634 72 634 90 V142 Q634 160 616 160 H456 L432 178 L438 160 H420 Q402 160 402 142Z"/>
    <text x="424" y="110" class="bubble-text">“이 티셔츠</text><text x="424" y="135" class="bubble-text">마음에 든다!”</text>
    <text x="28" y="325" class="caption">DB · products SELECT / 데이터 변경 없음</text>
  </g>

  <!-- CUT 2 -->
  <g transform="translate(740 145)">
    <rect class="cut" width="660" height="350" rx="24"/>
    <text x="26" y="42" class="cut-title">2컷 · 로그인하고 회원이 되다</text>
    <g transform="translate(100 190) scale(.76)"><use href="#buyer"/></g>
    <path class="bubble" d="M159 84 Q159 69 177 69 H368 Q386 69 386 87 V132 Q386 150 368 150 H230 L207 167 L213 150 H177 Q159 150 159 132Z"/>
    <text x="181" y="108" class="bubble-text">“이제 내 계정으로</text><text x="181" y="133" class="bubble-text">안전하게 주문!”</text>
    <rect x="416" y="74" width="210" height="212" rx="17" fill="#f5f8f4" stroke="#dfe7e1" stroke-width="2"/>
    <text x="438" y="106" class="body" font-weight="800">로그인 성공</text>
    <text x="438" y="140" class="small">users.id</text><text x="438" y="164" class="code">U1</text>
    <text x="438" y="196" class="small">비밀번호</text><text x="438" y="219" class="code">Argon2id 해시 확인</text>
    <rect x="436" y="239" width="170" height="29" rx="14" fill="#e6f0e6"/>
    <text x="521" y="259" text-anchor="middle" class="small" font-weight="700">HttpOnly JWT 쿠키</text>
    <text x="28" y="325" class="caption">DB · users SELECT / 로그인 쿠키 발급</text>
  </g>

  <!-- CUT 3 -->
  <g transform="translate(40 515)">
    <rect class="cut" width="660" height="350" rx="24"/>
    <text x="26" y="42" class="cut-title">3컷 · P1 두 개를 장바구니에</text>
    <g transform="translate(90 205) scale(.68)"><use href="#buyer"/></g>
    <path class="bubble" d="M149 86 Q149 70 167 70 H353 Q371 70 371 88 V135 Q371 153 353 153 H222 L198 170 L204 153 H167 Q149 153 149 135Z"/>
    <text x="171" y="111" class="bubble-text">“수량은 2개로</text><text x="171" y="136" class="bubble-text">담아주세요!”</text>
    <rect x="397" y="76" width="229" height="211" rx="17" fill="#fff" stroke="#dfe7e1" stroke-width="2"/>
    <text x="417" y="106" class="small">orders</text>
    <rect x="413" y="117" width="196" height="38" rx="8" class="table-head"/>
    <text x="425" y="141" class="code">id</text><text x="490" y="141" class="code">user_id</text><text x="563" y="141" class="code">status</text>
    <text x="425" y="179" class="code">O1</text><text x="490" y="179" class="code">U1</text><text x="563" y="179" class="code">cart</text>
    <line x1="413" y1="190" x2="609" y2="190" class="table-line"/>
    <text x="417" y="216" class="small">order_items</text>
    <text x="417" y="241" class="code">P1 · 티셔츠 · 2개</text>
    <text x="417" y="266" class="code">19,000원 × 2 = 38,000원</text>
    <text x="28" y="325" class="caption">DB · orders + order_items INSERT / 재고 그대로</text>
  </g>

  <!-- CUT 4 -->
  <g transform="translate(740 515)">
    <rect class="cut" width="660" height="350" rx="24"/>
    <text x="26" y="42" class="cut-title">4컷 · “하나 더!” 수량 변경</text>
    <g transform="translate(100 201) scale(.68)"><use href="#buyer"/></g>
    <path class="bubble" d="M160 84 Q160 69 178 69 H365 Q383 69 383 87 V133 Q383 151 365 151 H228 L205 168 L211 151 H178 Q160 151 160 133Z"/>
    <text x="182" y="111" class="bubble-text">“3개로 바꾸면</text><text x="182" y="136" class="bubble-text">합계는 얼마지?”</text>
    <rect x="410" y="79" width="212" height="177" rx="17" fill="#f5f8f4" stroke="#dfe7e1" stroke-width="2"/>
    <text x="432" y="111" class="small">PATCH · order_items</text>
    <text x="432" y="151" class="body" font-weight="700">quantity</text>
    <rect x="526" y="126" width="62" height="40" rx="10" fill="#fff" stroke="#d5dfd7" stroke-width="2"/>
    <text x="557" y="153" text-anchor="middle" class="body" font-weight="800">2 → 3</text>
    <line x1="432" y1="179" x2="598" y2="179" class="table-line"/>
    <text x="432" y="210" class="small">orders.total_amount</text>
    <text x="432" y="237" class="body" font-weight="800">38,000 → 57,000원</text>
    <text x="28" y="325" class="caption">DB · 수량과 합계 UPDATE / 재고 그대로</text>
  </g>

  <!-- CUT 5 -->
  <g transform="translate(40 885)">
    <rect class="cut" width="660" height="350" rx="24"/>
    <text x="26" y="42" class="cut-title">5컷 · 주문서 작성 완료</text>
    <g transform="translate(92 205) scale(.67)"><use href="#buyer"/></g>
    <path class="bubble" d="M151 82 Q151 67 169 67 H352 Q370 67 370 85 V132 Q370 150 352 150 H223 L199 167 L205 150 H169 Q151 150 151 132Z"/>
    <text x="173" y="108" class="bubble-text">“배송지를 입력하고</text><text x="173" y="133" class="bubble-text">주문할게요!”</text>
    <rect x="395" y="75" width="235" height="213" rx="17" fill="#fff" stroke="#dfe7e1" stroke-width="2"/>
    <text x="416" y="108" class="small">orders</text>
    <text x="416" y="140" class="code">O1 · user U1</text>
    <rect x="416" y="153" width="187" height="36" rx="18" fill="#fff3d8"/>
    <text x="509" y="177" text-anchor="middle" class="small" font-weight="800">status: pending</text>
    <text x="416" y="215" class="small">order_items · 가격 스냅샷</text>
    <text x="416" y="242" class="code">P1 · 3개 · 19,000원</text>
    <text x="416" y="268" class="body" font-weight="800">합계 57,000원</text>
    <text x="28" y="325" class="caption">DB · cart → pending / 재고 예약 안 함</text>
  </g>

  <!-- CUT 6 -->
  <g transform="translate(740 885)">
    <rect class="cut" width="660" height="350" rx="24"/>
    <text x="26" y="42" class="cut-title">6컷 · 모의 결제 성공!</text>
    <g transform="translate(100 205) scale(.67)"><use href="#buyer"/></g>
    <path class="bubble" d="M158 82 Q158 67 176 67 H365 Q383 67 383 85 V132 Q383 150 365 150 H229 L206 167 L212 150 H176 Q158 150 158 132Z"/>
    <text x="180" y="108" class="bubble-text">“결제를 성공으로</text><text x="180" y="133" class="bubble-text">처리해 주세요!”</text>
    <rect x="405" y="75" width="222" height="214" rx="17" fill="#f5f8f4" stroke="#dfe7e1" stroke-width="2"/>
    <text x="426" y="108" class="small">한 트랜잭션으로 저장</text>
    <circle cx="439" cy="143" r="10" fill="#215c49"/><path d="M434 143 l4 4 l7 -9" fill="none" stroke="#fff" stroke-width="2.5"/>
    <text x="459" y="149" class="body">재고 차감 · S → S−3</text>
    <circle cx="439" cy="184" r="10" fill="#215c49"/><path d="M434 184 l4 4 l7 -9" fill="none" stroke="#fff" stroke-width="2.5"/>
    <text x="459" y="190" class="body">payments · success</text>
    <circle cx="439" cy="225" r="10" fill="#215c49"/><path d="M434 225 l4 4 l7 -9" fill="none" stroke="#fff" stroke-width="2.5"/>
    <text x="459" y="231" class="body">orders · paid</text>
    <text x="426" y="270" class="caption">COMMIT · 세 변경 함께 확정</text>
    <text x="28" y="325" class="caption">실패라면 payment만 failed · 주문 pending</text>
  </g>

  <!-- CUT 7 -->
  <g transform="translate(40 1255)">
    <rect class="cut" width="1360" height="420" rx="24"/>
    <text x="28" y="44" class="cut-title">7컷 · 구매내역에서 다시 만난 P1</text>
    <g transform="translate(114 225) scale(.82)"><use href="#buyer"/></g>
    <path class="bubble" d="M174 96 Q174 80 192 80 H411 Q429 80 429 98 V145 Q429 163 411 163 H251 L228 180 L234 163 H192 Q174 163 174 145Z"/>
    <text x="196" y="111" class="bubble-text">“주문 당시 가격과</text><text x="196" y="137" class="bubble-text">결제 상태까지 남았네!”</text>
    <rect x="484" y="82" width="822" height="280" rx="18" fill="#fff" stroke="#dfe7e1" stroke-width="2"/>
    <text x="511" y="119" class="small">GET /api/members/me/orders · 본인 주문만</text>
    <rect x="507" y="138" width="776" height="48" rx="10" class="table-head"/>
    <text x="528" y="168" class="body" font-weight="800">order_id</text>
    <text x="713" y="168" class="body" font-weight="800">상품 스냅샷</text>
    <text x="958" y="168" class="body" font-weight="800">합계</text>
    <text x="1138" y="168" class="body" font-weight="800">상태</text>
    <line x1="507" y1="196" x2="1283" y2="196" class="table-line"/>
    <text x="528" y="231" class="code">O1 · U1</text>
    <text x="713" y="231" class="body">P1 티셔츠 · 3개</text>
    <text x="958" y="231" class="body" font-weight="800">57,000원</text>
    <rect x="1128" y="210" width="119" height="31" rx="15" fill="#e6f0e6"/>
    <text x="1187" y="231" text-anchor="middle" class="small" font-weight="800">paid</text>
    <line x1="507" y1="251" x2="1283" y2="251" class="table-line"/>
    <text x="528" y="282" class="small">cart 상태는 목록에서 제외 · 재결제 요청도 재고를 다시 줄이지 않음</text>
    <text x="28" y="385" class="caption">끝! users → orders → order_items → payments까지 구매 여정 완성</text>
  </g>

  <text x="48" y="1730" class="small">모아샵 MVP · 컷과 말풍선은 SVG로 직접 그렸으며 생성형 AI 이미지가 아닙니다.</text>
</svg>
